services:
  tiktokgrabbot:
    build: .
    container_name: tiktokgrabbot
    env_file:
      - .env
    environment:
      - REDIS_ENABLED=false
    ports:
      - "${WEBHOOK_PORT:-8080}:${WEBHOOK_PORT:-8080}"
    labels:
      - traefik.enable=true
      - traefik.http.routers.tiktokgrabbot.rule=Host(`${WEBHOOK_DOMAIN}`)
      - traefik.http.routers.tiktokgrabbot.entrypoints=websecure
      - traefik.http.routers.tiktokgrabbot.tls.certresolver=letsencrypt
      - traefik.http.routers.tiktokgrabbot.service=tiktokgrabbot
      - traefik.http.services.tiktokgrabbot.loadbalancer.server.port=${WEBHOOK_PORT:-8080}
      - traefik.docker.network=docker_network
    networks:
      - service
    restart: unless-stopped

networks:
  service:
    name: docker_network
