admin:
  help_mt: |
    Админ-команды:
    /admin - показать помощь
    /base - всего пользователей
    /cleanbase - удалить неактивных пользователей (с подтверждением)
    /getbase - экспорт всех user ID
    /draw - запустить рассылку
    /test - запрос метаданных через NATS для тестового URL
    /test1 [360p|480p|720p|1080p|audio] - тестовая загрузка через NATS
    /ads - показать рекламные кампании BotAds
    /broadcast - тестовый запуск BotAds broadcast
    /premiumstats - Premium: активные, звёзды, последние оплаты
    /givepremium USER_ID DAYS - выдать Premium на DAYS дней (0 - забрать)
    /refund CHARGE_ID - вернуть звёзды и забрать оплаченное
  base_count_mt: |
    Всего пользователей: {{ total_count }}
  test_meta_started_mt: |
    Запрос метаданных в NATS отправлен. Ответ будет в консоли.
  nats_meta_timeout_mt: |
    Таймаут NATS или нет responders на manager subject.
  nats_meta_failed_mt: |
    Ошибка запроса метаданных NATS: {{ error }}
  nats_meta_done_mt: |
    Готово. result={{ result }}
  test_download_started_mt: |
    Запрос загрузки ({{ quality }}) в NATS отправлен. ACK будет в консоли.
  test_download_bad_quality_mt: |
    Неизвестное качество. Доступны: {{ qualities }}
  nats_download_timeout_mt: |
    Таймаут NATS или нет responders на manager_download subject.
  nats_download_failed_mt: |
    Ошибка запроса загрузки NATS: {{ error }}
  nats_download_done_mt: |
    Готово. status={{ status }} result={{ result }}
  cleanbase_confirm_mt: |
    Напишите "yes", чтобы удалить {{ num_non_active }} неактивных пользователей.
  cleanbase_removed_mt: |
    Удалено {{ deleted_count }} неактивных пользователей.
  cancelled_mt: |
    Отменено.
  getbase_loading_mt: |
    Файл загружается, подождите немного...
  draw_error_mt: |
    {{ error }}
  unknown_error_mt: |
    Неизвестная ошибка

  givepremium_usage_mt: |
    Использование: /givepremium USER_ID DAYS (0 - забрать Premium)
  user_not_found_mt: |
    Пользователя {{ user_id }} нет в базе.
  premium_granted_mt: |
    ✅ {{ user_id }}: Premium до {{ until }}
  premium_revoked_mt: |
    Premium для {{ user_id }} снят.
  refund_usage_mt: |
    Использование: /refund CHARGE_ID (ID видно в /premiumstats)
  refund_already_mt: |
    Платёж {{ charge_id }} уже возвращён.
  refund_failed_mt: |
    ❌ Не удалось вернуть: {{ error }}
  refund_cancel_failed_mt: |
    ⚠️ Звёзды возвращены, но подписка не отменена: {{ error }}
  refund_done_mt: |
    ✅ Возвращено {{ amount }} ⭐ пользователю {{ user_id }}.{% if days %} Снято дней Premium: {{ days }}.{% endif %}{% if credits %} Снято разовых: {{ credits }}.{% endif %}
  premium_stats_mt: |
    ⭐ Premium сейчас: {{ active }} (с автопродлением: {{ renewing }})
    💰 За 30 дней: {{ stars_30d }} ⭐ (оплат: {{ count_30d }})
    💰 Всего: {{ stars_all }} ⭐ (оплат: {{ count_all }})
    {% if recent %}
    Последние оплаты:
    {% for p in recent %}• {{ p.date }} · {{ p.user_id }} · {{ p.product }} · {{ p.amount }} ⭐{% if p.refunded %} (возвращён){% endif %}
      <code>{{ p.charge_id }}</code>
    {% endfor %}{% endif %}

start:
  choose_language_mt: |
    Выберите язык:
  language_saved_mt: |
    Язык выбран: {{ language_text }}
    Отправьте ссылку на YouTube, чтобы скачать видео или аудио.
  unsupported_language_mt: |
    Неподдерживаемый язык.

help:
  mt: |
    <b>{{ bot_name }}</b> загружает видео и аудио с YouTube прямо в Telegram.
    Удобно, чтобы смотреть и слушать офлайн.

    <b>Как пользоваться:</b>
    1) Открой видео на YouTube (например, <a href="https://www.youtube.com/watch?v=f4Mc-NYPHaQ">ссылку</a>)
    2) Нажми «Поделиться» → Telegram
    3) Выбери чат с ботом и отправь ссылку
    4) Выбери качество: от 360p до 1080p или аудио

    Или просто вставь ссылку в этот чат.

    <b>Бесплатно:</b> до {{ free_limit }} загрузок в сутки, до 720p{% if free_mb %} и до {{ free_mb }} МБ{% endif %}. Видео из кеша ⚡ не считаются.
    <b>⭐ Premium:</b> 1080p{% if free_mb %}, файлы до 2 ГБ{% endif %}, без лимитов и рекламы, текст видео: /premium

    <b>Поддерживаемые источники сейчас:</b>
    • YouTube

    <b>Обратная связь:</b> @dindira

draw:
  no_campaigns_mt: |
    Для этого бота нет доступных кампаний.
  mt: |
    Доступные кампании:
    {% for campaign_name in campaigns %}
    <b>{{ campaign_name }}:</b>
      Заказано показов: {{ campaigns[campaign_name].ordered_count }}
      CPM: {{ campaigns[campaign_name].cpm }}
      Объявления:
      {% for advert in campaigns[campaign_name].adverts %}
      - {% if advert.media %}медиа{% else %}текст{% endif %}: {{ advert.text|escape|truncate(100, True) }}
      {% endfor %}
    {% endfor %}

    Напишите "start", чтобы запустить рассылку.
  start_draw_mt: |
    Рассылка запущена.
  not_start_draw_mt: |
    Рассылка отменена.
  end_draw_mt: |
    Рассылка завершена.

download:
  send_youtube_link_mt: |
    💁‍♀️ Скинь мне ссылку на youtube ролик...
  choose_quality_mt: |
    {% if title %}🎬 <b>{{ title }}</b>{% if duration %} · {{ duration }}{% endif %}{{ "\n\n" }}{% endif %}Выбери качество:
    {{ cached_icon }} — мгновенно, уже есть в кеше{% if show_quota %}, не тратит лимит{% endif %}
    {{ download_icon }} — скачаю с YouTube
    {%- if show_quota %}
    {{ locked_icon }} — только в Premium: /premium

    🆓 Вы использовали сегодня: {{ quota_used }} из {{ quota_limit }}{% if not quota_left and quota_wait %}, лимит обновится через {{ quota_wait }}{% endif %}
    {%- elif premium %}

    ⭐ Premium
    {%- endif %}
  audio_button_mt: |
    Аудио
  already_requested_mt: |
    ⏳ Запрос уже обрабатывается
  picker_expired_mt: |
    Кнопка устарела. Отправь ссылку ещё раз.
  cache_hit_mt: |
    ⚡ Отправляю из кеша.
  request_created_mt: |
    👨‍💻 Получаю метаданные...
  failed_before_progress_mt: |
    ❌ Ошибка: {{ error_message }}
  processing_download_mt: |
    ⏳ Готовлю загрузку...
  processing_info_attempt_mt: |
    👨‍💻 Получаю метаданные... (попытка {{ attempt }} из {{ total_attempts }})
  processing_download_attempt_mt: |
    ⏳ Готовлю загрузку... (попытка {{ attempt }} из {{ total_attempts }})
  queue_failed_mt: |
    ❌ Нет связи с серверами загрузки.
    Попробуй еще раз через несколько секунд.
    request_id: {{ request_id }}
  rate_limited_mt: |
    ⛔ Вы отправляете слишком много запросов.
    Вы снова сможете пользоваться ботом через {{ retry_hours }} ч.
  rate_limited_minutes_mt: |
    ⏳ Слишком много загрузок за последний час.
    Попробуйте снова через {{ retry_minutes }} мин.
  start_failed_mt: |
    ❌ Не удалось запустить запрос на загрузку.
    request_id: {{ request_id }}
  transcript_button_mt: |
    Текст видео
  transcript_loading_mt: |
    📝 Получаю текст видео...
  transcript_caption_mt: |
    📝 {% if title %}<b>{{ title }}</b>
    {% endif %}{{ bot }}
  transcript_failed_mt: |
    ❌ Не удалось получить текст видео: {{ error_message }}
  credit_used_mt: |
    🎟 Использована разовая загрузка. Осталось: {{ left }}.
  credit_returned_mt: |
    🎟 Разовая загрузка возвращена на баланс. Попробуй ещё раз или выбери другое качество.

