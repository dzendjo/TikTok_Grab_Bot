admin:
  help_mt: |
    Админ-команды:
    /admin - показать помощь
    /base - всего пользователей
    /cleanbase - удалить неактивных пользователей (с подтверждением)
    /getbase - экспорт всех user ID
    /draw - запустить рассылку
    /test1 [video|audio] - тестовая загрузка TikTok через NATS
    /ads - показать рекламные кампании BotAds
    /broadcast - тестовый запуск BotAds broadcast
    /premiumstats - Premium: активные, звёзды, последние оплаты
    /givepremium USER_ID DAYS - выдать Premium на DAYS дней (0 - забрать)
    /refund CHARGE_ID - вернуть звёзды и забрать оплаченное
  base_count_mt: |
    Всего пользователей: {{ total_count }}
  test_download_started_mt: |
    Запрос загрузки ({{ quality }}) в NATS отправлен. ACK будет в консоли.
  test_download_bad_quality_mt: |
    Неизвестное качество. Доступны: {{ qualities }}
  nats_download_timeout_mt: |
    Таймаут NATS или нет responders на manager_download subject.
  nats_download_failed_mt: |
    Ошибка запроса загрузки NATS: {{ error }}
  nats_download_done_mt: |
    Готово. status={{ status }} result={{ result }}
  cleanbase_confirm_mt: |
    Напишите "yes", чтобы удалить {{ num_non_active }} неактивных пользователей.
  cleanbase_removed_mt: |
    Удалено {{ deleted_count }} неактивных пользователей.
  cancelled_mt: |
    Отменено.
  getbase_loading_mt: |
    Файл загружается, подождите немного...
  draw_error_mt: |
    {{ error }}
  unknown_error_mt: |
    Неизвестная ошибка

  givepremium_usage_mt: |
    Использование: /givepremium USER_ID DAYS (0 - забрать Premium)
  user_not_found_mt: |
    Пользователя {{ user_id }} нет в базе.
  premium_granted_mt: |
    ✅ {{ user_id }}: Premium до {{ until }}
  premium_revoked_mt: |
    Premium для {{ user_id }} снят.
  refund_usage_mt: |
    Использование: /refund CHARGE_ID (ID видно в /premiumstats)
  refund_already_mt: |
    Платёж {{ charge_id }} уже возвращён.
  refund_failed_mt: |
    ❌ Не удалось вернуть: {{ error }}
  refund_cancel_failed_mt: |
    ⚠️ Звёзды возвращены, но подписка не отменена: {{ error }}
  refund_done_mt: |
    ✅ Возвращено {{ amount }} ⭐ пользователю {{ user_id }}.{% if days %} Снято дней Premium: {{ days }}.{% endif %}{% if credits %} Снято разовых: {{ credits }}.{% endif %}
  premium_stats_mt: |
    ⭐ Premium сейчас: {{ active }} (с автопродлением: {{ renewing }})
    💰 За 30 дней: {{ stars_30d }} ⭐ (оплат: {{ count_30d }})
    💰 Всего: {{ stars_all }} ⭐ (оплат: {{ count_all }})
    {% if recent %}
    Последние оплаты:
    {% for p in recent %}• {{ p.date }} · {{ p.user_id }} · {{ p.product }} · {{ p.amount }} ⭐{% if p.refunded %} (возвращён){% endif %}
      <code>{{ p.charge_id }}</code>
    {% endfor %}{% endif %}

start:
  choose_language_mt: |
    Выберите язык:
  language_saved_mt: |
    Язык выбран: {{ language_text }}
    Отправьте ссылку на TikTok, чтобы скачать видео без водяного знака или фото.
  unsupported_language_mt: |
    Неподдерживаемый язык.

help:
  mt: |
    <b>{{ bot_name }}</b> скачивает видео из TikTok без водяного знака прямо в Telegram.

    <b>Как пользоваться:</b>
    1) В TikTok нажми «Поделиться» → «Копировать ссылку»
    2) Отправь ссылку в этот чат
    3) Получи видео в лучшем качестве, а для фото-поста — альбом с фото

    <b>Бесплатно:</b> до {{ free_limit }} загрузок в сутки. Видео, которые уже кто-то скачивал, приходят мгновенно и не считаются.
    <b>⭐ Premium:</b> без лимитов и рекламы: /premium

    <b>Обратная связь:</b> @dindira

draw:
  no_campaigns_mt: |
    Для этого бота нет доступных кампаний.
  mt: |
    Доступные кампании:
    {% for campaign_name in campaigns %}
    <b>{{ campaign_name }}:</b>
      Заказано показов: {{ campaigns[campaign_name].ordered_count }}
      CPM: {{ campaigns[campaign_name].cpm }}
      Объявления:
      {% for advert in campaigns[campaign_name].adverts %}
      - {% if advert.media %}медиа{% else %}текст{% endif %}: {{ advert.text|escape|truncate(100, True) }}
      {% endfor %}
    {% endfor %}

    Напишите "start", чтобы запустить рассылку.
  start_draw_mt: |
    Рассылка запущена.
  not_start_draw_mt: |
    Рассылка отменена.
  end_draw_mt: |
    Рассылка завершена.

download:
  already_requested_mt: |
    ⏳ Запрос уже обрабатывается
  request_created_mt: |
    👨‍💻 Обрабатываю ссылку...
  failed_before_progress_mt: |
    ❌ Ошибка: {{ error_message }}
  processing_info_attempt_mt: |
    👨‍💻 Обрабатываю ссылку... (попытка {{ attempt }} из {{ total_attempts }})
  queue_failed_mt: |
    ❌ Нет связи с серверами загрузки.
    Попробуй еще раз через несколько секунд.
    request_id: {{ request_id }}
  rate_limited_mt: |
    ⛔ Вы отправляете слишком много запросов.
    Вы снова сможете пользоваться ботом через {{ retry_hours }} ч.
  rate_limited_minutes_mt: |
    ⏳ Слишком много загрузок за последний час.
    Попробуйте снова через {{ retry_minutes }} мин.
  start_failed_mt: |
    ❌ Не удалось запустить запрос на загрузку.
    request_id: {{ request_id }}
  credit_used_mt: |
    🎟 Использована разовая загрузка. Осталось: {{ left }}.
  credit_returned_mt: |
    🎟 Разовая загрузка возвращена на баланс. Попробуй ещё раз.
  send_tiktok_link_mt: |
    💁‍♀️ Пришли мне ссылку на видео или фото из TikTok...
  button_expired_mt: |
    Кнопка устарела. Пришли ссылку ещё раз.

download_status:
  busy_retry_mt: |
    ⏳ Все серверы сейчас заняты. Твой запрос в приоритете: пробую ещё раз каждые {{ delay }} с (попытка {{ attempt }})…
  header_mt: |
    👩‍🔬 Обработка запроса:
  bottom_ad_mt: |
    <b>📺 Видео с YouTube в Telegram — бесплатно и без тупых подписок на каналы: @Ytbvideobot</b>
  step_downloading_mt: |
    {% if quality == "audio" %}Скачиваю звук{% else %}Скачиваю из TikTok{% endif %}{% if progress is not none %} ({{ progress }}%){% endif %}
  step_downloaded_mt: |
    Файл загружен
  step_processing_optimization_mt: |
    Обработка и оптимизация
  step_uploading_to_telegram_mt: |
    Загружаю в Telegram{% if progress is not none %} ({{ progress }}%){% endif %}
  step_completed_mt: |
    Запрос успешно обработан
  failed_on_mt: |
    Ошибка на шаге: {{ step }}
  error_mt: |
    ❌ Ошибка: {{ error_message }}
  code_mt: |
    code: {{ error_code }}
  error_code_301_mt: |
    Серверы перегружены запросами. Попробуйте снова через 1–2 минуты.
  error_code_302_mt: |
    Не удалось скачать этот пост.
  error_code_303_mt: |
    Не удалось получить метаданные видео.
  error_code_304_mt: |
    Превышено время ожидания метаданных.
  error_code_305_mt: |
    Превышено время ожидания загрузки файла.
  error_code_310_mt: |
    Не удалось загрузить файл в Telegram.
  error_code_311_mt: |
    Нет доступных каналов для загрузки.
  error_code_312_mt: |
    Сервис загрузки в Telegram не ответил (таймаут).
  error_code_401_mt: |
    Внутренняя ошибка сервера. Попробуйте позже.
  error_code_402_mt: |
    Источник недоступен или заблокирован.
  error_code_403_mt: |
    Сейчас нет доступного воркера. Попробуйте позже.
  error_code_404_mt: |
    Нет здоровых воркеров. Попробуйте позже.
  error_code_405_mt: |
    TikTok ограничил доступ из текущего региона или VPN.
  error_code_406_mt: |
    Воркер перезапускается. Попробуйте через минуту.
  error_code_407_mt: |
    Отправьте ссылку на конкретное видео, а не на вкладку/плейлист/канал.
  error_code_408_mt: |
    Live-трансляции и запланированные стримы сейчас не поддерживаются.
  unknown_status_mt: |
    ℹ️ Статус: {{ status }}
  request_id_mt: |
    request_id: {{ request_id }}
  unknown_error_mt: |
    Неизвестная ошибка
  error_code_409_mt: |
    Пост недоступен: он приватный, удалён, 18+ или это ссылка не на видео или фото (профили и трансляции не поддерживаются).
  error_code_410_mt: |
    TikTok не отдаёт этот пост: скорее всего, его удалили или автор ограничил доступ.
  error_no_sound_mt: |
    У этого поста нет звука.

premium:
  benefits_mt: |
    ⭐ <b>Premium</b>
    • без дневного лимита (бесплатно — до {{ free_limit }} загрузок в сутки)
    • без рекламы
    • приоритет, когда серверы загружены
  locked_quota_mt: |
    ⏳ Бесплатный лимит исчерпан: до {{ free_limit }} загрузок в сутки.{% if wait %}
    Следующая бесплатная — через {{ wait }}.{% endif %}
    ⚡ Видео, которые уже кто-то скачивал, можно брать без лимита.
  status_active_mt: |
    ⭐ <b>Premium активен</b> до {{ until }}.{% if auto_renew %}
    🔄 Автопродление: {{ price }} ⭐ каждые 30 дней.{% endif %}

    Продлить можно кнопками ниже, дни добавляются к текущему сроку.
  status_free_mt: |
    🆓 Вы использовали сегодня: {{ used }} из {{ limit }} бесплатных загрузок.
  credits_balance_mt: |
    🎟 Разовых загрузок на балансе: {{ count }}
  btn_month_mt: |
    ⭐ Подписка · {{ price }} ⭐/мес
  btn_quarter_mt: |
    3 месяца · {{ price }} ⭐
  btn_year_mt: |
    Год · {{ price }} ⭐
  btn_single_mt: |
    🎟 Только этот раз ({{ what }}) · {{ price }} ⭐
  btn_renew_off_mt: |
    Отключить автопродление
  btn_renew_on_mt: |
    Включить автопродление
  invoice_month_title_mt: |
    Premium · 30 дней
  invoice_month_desc_mt: |
    Загрузки из TikTok без дневного лимита и рекламы. Подписка продлевается каждые 30 дней, отменить можно в любой момент.
  invoice_quarter_title_mt: |
    Premium · 90 дней
  invoice_quarter_desc_mt: |
    Загрузки из TikTok без дневного лимита и рекламы. Разовый платёж без автопродления.
  invoice_year_title_mt: |
    Premium · 365 дней
  invoice_year_desc_mt: |
    Загрузки из TikTok без дневного лимита и рекламы. Разовый платёж без автопродления.
  invoice_single_title_mt: |
    Разовая загрузка
  invoice_single_desc_mt: |
    {{ what }}: одна загрузка без лимита и рекламы.
  activated_mt: |
    ✅ Premium активирован до {{ until }}. Спасибо!
  renewed_mt: |
    🔄 Premium продлён до {{ until }}.
  single_paid_mt: |
    ✅ Оплачено: {{ what }}. Запускаю…
  renew_off_done_mt: |
    Автопродление отключено. Premium действует до {{ until }}.
  renew_on_done_mt: |
    🔄 Автопродление снова включено.
  renew_failed_mt: |
    Не удалось изменить подписку. Управлять ею можно в Telegram: Настройки → Мои звёзды.
  checkout_invalid_mt: |
    Этот счёт устарел. Открой /premium ещё раз.
  paysupport_mt: |
    💬 Вопросы по оплате или возврату звёзд — пиши @dindira.
    Добавь ID платежа из чека Telegram, так мы быстрее найдём оплату.
  wait_mt: |
    {% if hours %}{{ hours }} ч{% endif %}{% if hours and minutes %} {% endif %}{% if minutes or not hours %}{{ minutes }} мин{% endif %}
  action_video_mt: |
    видео
  action_audio_mt: |
    звук
