    👩‍🔬 Обработка запроса:
  bottom_ad_mt: |
    <b><tg-emoji emoji-id="5226639745106330551">🧠</tg-emoji> AI-конспект YouTube-видео: основные тезисы бесплатно — @shortsum_bot</b>
  step_downloading_mt: |
    {% if quality == "audio" %}Загружаю аудио{% elif quality %}Загружаю видео {{ quality }}{% else %}Загружаю файл{% endif %}{% if progress is not none %} ({{ progress }}%){% endif %}
