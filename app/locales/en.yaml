admin:
  help_mt: |
    Admin commands:
    /admin - show this help
    /base - total users
    /cleanbase - delete inactive users (asks for confirmation)
    /getbase - export all user IDs
    /draw - start a mailing
    /test1 [video|audio] - test TikTok download over NATS
    /ads - show BotAds campaigns
    /broadcast - test BotAds broadcast
    /premiumstats - Premium: active, stars, recent payments
    /givepremium USER_ID DAYS - give Premium for DAYS days (0 - remove)
    /refund CHARGE_ID - refund stars and take back what was paid for
  base_count_mt: |
    Total users: {{ total_count }}
  test_download_started_mt: |
    NATS download request ({{ quality }}) started. ACK will be printed to console.
  test_download_bad_quality_mt: |
    Unknown quality. Available: {{ qualities }}
  nats_download_timeout_mt: |
    NATS timeout or no responders on manager_download subject.
  nats_download_failed_mt: |
    NATS download request failed: {{ error }}
  nats_download_done_mt: |
    Done. status={{ status }} result={{ result }}
  cleanbase_confirm_mt: |
    Type "yes" to remove {{ num_non_active }} inactive users.
  cleanbase_removed_mt: |
    Removed {{ deleted_count }} inactive users.
  cancelled_mt: |
    Cancelled.
  getbase_loading_mt: |
    File is loading, wait a little...
  draw_error_mt: |
    {{ error }}
  unknown_error_mt: |
    Unknown error

  givepremium_usage_mt: |
    Usage: /givepremium USER_ID DAYS (0 - remove Premium)
  user_not_found_mt: |
    User {{ user_id }} is not in the database.
  premium_granted_mt: |
    ✅ {{ user_id }}: Premium until {{ until }}
  premium_revoked_mt: |
    Premium removed for {{ user_id }}.
  refund_usage_mt: |
    Usage: /refund CHARGE_ID (IDs are listed in /premiumstats)
  refund_already_mt: |
    Payment {{ charge_id }} is already refunded.
  refund_failed_mt: |
    ❌ Refund failed: {{ error }}
  refund_cancel_failed_mt: |
    ⚠️ Stars refunded, but the subscription was not cancelled: {{ error }}
  refund_done_mt: |
    ✅ Refunded {{ amount }} ⭐ to user {{ user_id }}.{% if days %} Premium days removed: {{ days }}.{% endif %}{% if credits %} Single credits removed: {{ credits }}.{% endif %}
  premium_stats_mt: |
    ⭐ Premium now: {{ active }} (auto-renewing: {{ renewing }})
    💰 Last 30 days: {{ count_30d }} payments, {{ stars_30d }} ⭐
    💰 All time: {{ count_all }} payments, {{ stars_all }} ⭐
    {% if recent %}
    Recent payments:
    {% for p in recent %}• {{ p.date }} · {{ p.user_id }} · {{ p.product }} · {{ p.amount }} ⭐{% if p.refunded %} (refunded){% endif %}
      <code>{{ p.charge_id }}</code>
    {% endfor %}{% endif %}

start:
  choose_language_mt: |
    Choose your language:
  language_saved_mt: |
    Language selected: {{ language_text }}
    Send a TikTok link to download the video without watermark, the photos or the sound.
  unsupported_language_mt: |
    Unsupported language.

help:
  mt: |
    <b>{{ bot_name }}</b> downloads TikTok videos without watermark straight into Telegram.

    <b>How to use:</b>
    1) In TikTok tap "Share" → "Copy link"
    2) Send the link to this chat
    3) Get the video in the best quality, or an album for a photo post
    4) The "🎵 Sound" button under the video sends the sound as a separate file

    <b>Free:</b> up to {{ free_limit }} downloads a day. Videos someone has already downloaded arrive instantly and don't count.
    <b>⭐ Premium:</b> no limits and no ads: /premium

    <b>Feedback:</b> @dindira

draw:
  no_campaigns_mt: |
    No campaigns available for this bot.
  mt: |
    Available campaigns:
    {% for campaign_name in campaigns %}
    <b>{{ campaign_name }}:</b>
      Ordered views: {{ campaigns[campaign_name].ordered_count }}
      CPM: {{ campaigns[campaign_name].cpm }}
      Adverts:
      {% for advert in campaigns[campaign_name].adverts %}
      - {% if advert.media %}media{% else %}text{% endif %}: {{ advert.text|escape|truncate(100, True) }}
      {% endfor %}
    {% endfor %}

    Send "start" to run draw.
  start_draw_mt: |
    Draw started.
  not_start_draw_mt: |
    Draw cancelled.
  end_draw_mt: |
    Draw finished.

download:
  audio_button_mt: |
    Sound
  already_requested_mt: |
    ⏳ Request is already in progress
  request_created_mt: |
    👨‍💻 Processing the link...
  failed_before_progress_mt: |
    ❌ Error: {{ error_message }}
  processing_info_attempt_mt: |
    👨‍💻 Processing the link... (attempt {{ attempt }} of {{ total_attempts }})
  queue_failed_mt: |
    ❌ No connection to download servers.
    Please try again in a few seconds.
    request_id: {{ request_id }}
  rate_limited_mt: |
    ⛔ You are sending too many requests.
    You can use the bot again in {{ retry_hours }} h.
  rate_limited_minutes_mt: |
    ⏳ Too many downloads in the last hour.
    Try again in {{ retry_minutes }} min.
  start_failed_mt: |
    ❌ Failed to start download request.
    request_id: {{ request_id }}
  credit_used_mt: |
    🎟 Used one single download. Left: {{ left }}.
  credit_returned_mt: |
    🎟 The single download is back on your balance. Try again.
  send_tiktok_link_mt: |
    💁‍♀️ Send me a link to a TikTok video or photo post...
  button_expired_mt: |
    This button has expired. Send the link again.

download_status:
  busy_retry_mt: |
    ⏳ All servers are busy right now. Your request has priority: retrying every {{ delay }} s (attempt {{ attempt }})…
  header_mt: |
    👩‍🔬 Request processing:
  bottom_ad_mt: |
    <b>📺 YouTube videos in Telegram — free and without any forced channel subscriptions: @Ytbvideobot</b>
  step_downloading_mt: |
    {% if quality == "audio" %}Downloading the sound{% else %}Downloading from TikTok{% endif %}{% if progress is not none %} ({{ progress }}%){% endif %}
  step_downloaded_mt: |
    File downloaded
  step_processing_optimization_mt: |
    Processing and optimization
  step_uploading_to_telegram_mt: |
    Uploading to Telegram{% if progress is not none %} ({{ progress }}%){% endif %}
  step_completed_mt: |
    Request processed successfully
  failed_on_mt: |
    Failed on: {{ step }}
  error_mt: |
    ❌ Error: {{ error_message }}
  code_mt: |
    code: {{ error_code }}
  error_code_301_mt: |
    Servers are overloaded with requests. Please try again in 1–2 minutes.
  error_code_302_mt: |
    Couldn't download this post.
  error_code_303_mt: |
    Failed to fetch video metadata.
  error_code_304_mt: |
    Metadata request timed out.
  error_code_305_mt: |
    Download timed out.
  error_code_310_mt: |
    Failed to upload file to Telegram.
  error_code_311_mt: |
    No available upload channels.
  error_code_312_mt: |
    Telegram uploader timed out.
  error_code_401_mt: |
    Internal server error. Please try again later.
  error_code_402_mt: |
    Source is unavailable or blocked.
  error_code_403_mt: |
    No worker is available right now. Please try again later.
  error_code_404_mt: |
    No healthy workers available. Please try again later.
  error_code_405_mt: |
    TikTok restricted access from the current region or VPN.
  error_code_406_mt: |
    Worker is restarting. Please retry in a minute.
  error_code_407_mt: |
    Send a direct video link, not a tab/playlist/channel-tab URL.
  error_code_408_mt: |
    Live and upcoming streams are not supported right now.
  unknown_status_mt: |
    ℹ️ Status: {{ status }}
  request_id_mt: |
    request_id: {{ request_id }}
  unknown_error_mt: |
    Unknown error
  error_code_409_mt: |
    This post is unavailable: it is private, deleted or 18+, or the link isn't to a video or photo post (profiles and lives aren't supported).
  error_code_410_mt: |
    TikTok won't serve this post: most likely it was deleted or the author restricted it.
  error_no_sound_mt: |
    This post has no sound.

premium:
  benefits_mt: |
    ⭐ <b>Premium</b>
    • no daily limit (free — up to {{ free_limit }} downloads a day)
    • no ads
    • priority when the servers are busy
  locked_quota_mt: |
    ⏳ Free limit reached: up to {{ free_limit }} downloads a day.{% if wait %}
    Next free download in {{ wait }}.{% endif %}
    ⚡ Videos someone has already downloaded are free of the limit.
  status_active_mt: |
    ⭐ <b>Premium is active</b> until {{ until }}.{% if auto_renew %}
    🔄 Auto-renewal: {{ price }} ⭐ every 30 days.{% endif %}

    You can extend it below, days are added to the current term.
  status_free_mt: |
    🆓 You've used today: {{ used }} of {{ limit }} free downloads.
  credits_balance_mt: |
    🎟 Single downloads on balance: {{ count }}
  btn_month_mt: |
    ⭐ Subscription · {{ price }} ⭐/mo
  btn_quarter_mt: |
    3 months · {{ price }} ⭐
  btn_year_mt: |
    Year · {{ price }} ⭐
  btn_single_mt: |
    🎟 Just this once ({{ what }}) · {{ price }} ⭐
  btn_renew_off_mt: |
    Turn off auto-renewal
  btn_renew_on_mt: |
    Turn on auto-renewal
  invoice_month_title_mt: |
    Premium · 30 days
  invoice_month_desc_mt: |
    TikTok downloads without the daily limit and ads. Renews every 30 days, cancel any time.
  invoice_quarter_title_mt: |
    Premium · 90 days
  invoice_quarter_desc_mt: |
    TikTok downloads without the daily limit and ads. One-time payment, no auto-renewal.
  invoice_year_title_mt: |
    Premium · 365 days
  invoice_year_desc_mt: |
    TikTok downloads without the daily limit and ads. One-time payment, no auto-renewal.
  invoice_single_title_mt: |
    Single download
  invoice_single_desc_mt: |
    {{ what }}: one download without the limit and ads.
  activated_mt: |
    ✅ Premium is active until {{ until }}. Thank you!
  renewed_mt: |
    🔄 Premium renewed until {{ until }}.
  single_paid_mt: |
    ✅ Paid: {{ what }}. Starting…
  renew_off_done_mt: |
    Auto-renewal is off. Premium stays active until {{ until }}.
  renew_on_done_mt: |
    🔄 Auto-renewal is back on.
  renew_failed_mt: |
    Couldn't change the subscription. You can manage it in Telegram: Settings → My Stars.
  checkout_invalid_mt: |
    This invoice is outdated. Open /premium again.
  paysupport_mt: |
    💬 Questions about payments or Star refunds — message @dindira.
    Include the payment ID from the Telegram receipt so we can find it faster.
  wait_mt: |
    {% if hours %}{{ hours }} h{% endif %}{% if hours and minutes %} {% endif %}{% if minutes or not hours %}{{ minutes }} min{% endif %}
  action_video_mt: |
    video
  action_audio_mt: |
    sound
