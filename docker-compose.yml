version: '3.8'

# Simple setup for development/small bots (MemoryStorage)
services:
  bot:
    build: .
    container_name: ytbvideobot_bot
    env_file:
      - .env
    depends_on:
      - mongodb
    networks:
      - bot_network
    restart: unless-stopped

  mongodb:
    image: mongo:7
    container_name: mongodb
    environment:
      MONGO_INITDB_DATABASE: YtbVideoBot
    volumes:
      - mongodb_data:/data/db
    networks:
      - bot_network
    restart: unless-stopped

volumes:
  mongodb_data:

networks:
  bot_network:
    name: bot_network
    driver: bridge
